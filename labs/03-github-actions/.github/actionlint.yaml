# actionlint config.
#
# `lab03-runner-demo.yml` (in the repo-root .github/workflows/) routes to a
# self-hosted runner tagged `local-lab03` (see docs/self-hosted-runners.md).
# actionlint doesn't know custom runner labels, so without this it would warn
# "label local-lab03 is unknown" on every run. Declaring it here is the
# documented fix — and how real repos teach actionlint about their own
# self-hosted fleet.
# NEW COMMENT
# actionlint only auto-loads .github/actionlint.yaml at the repo root, so Lab 03
# passes this file explicitly: `-config-file .github/actionlint.yaml` locally,
# the `flags:` input in lab03-ci.yml, and `args:` in .pre-commit-config.yaml.
self-hosted-runner:
  labels:
    - local-lab03
