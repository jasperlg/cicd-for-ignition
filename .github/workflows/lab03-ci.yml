name: Lab 03 · CI

# Monorepo scoping: only changes to this lab (or this workflow) trigger it.
# TODO (step 1): narrow `paths:` so docs-only PRs are skipped, plus a
# `push: branches: [main]` backstop. See the assignment.
on:
  pull_request:
    paths:
      - "labs/03-github-actions/projects/**"
      - "labs/03-github-actions/scripts/**"
      - "labs/03-github-actions/docker-compose.yml"
      - ".github/workflows/lab03-*.yml"
      - "labs/03-github-actions/.yamllint.yml"
      - "labs/03-github-actions/rule_config.json"
      - "labs/03-github-actions/.github/**"
  push:
    branches: [main]
    paths:
      - "labs/03-github-actions/**"
      - ".github/workflows/lab03-*.yml"
  workflow_dispatch:

concurrency:
  group: "lab03-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# Least-privilege default; jobs override if they need more.
permissions:
  contents: read

# Every `run:` step starts in the lab folder, as if you'd cd'd there yourself.
defaults:
  run:
    working-directory: labs/03-github-actions

jobs:
  # Job ids become the status-check names branch protection matches on —
  # keep `validate` and `lint` stable (renaming them orphans the required checks).

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/validate.sh
      - run: echo "leak? ${{ secrets.EXAMPLE_SECRET }}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # this job installs tools; give it more headroom than validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.35.1 ign-lint==0.6.1
      - run: yamllint -c .yamllint.yml . ../../.github/workflows/lab03-*.yml
      - uses: raven-actions/actionlint@v2
        with:                             # a `uses:` step: paths are repo-root-relative
          files: ".github/workflows/lab03-*.yml"
          flags: "-config-file labs/03-github-actions/.github/actionlint.yaml"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck scripts/*.sh
      - run: ign-lint --config rule_config.json --files "projects/**/view.json"
      - run: docker compose config -q
