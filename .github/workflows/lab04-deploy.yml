# Deploy to the test gateway on push to main.
#
# GitHub Flow: `main` is the single long-lived branch. Feature branches merge into
# it via PR, and every push here ships the working tree to the TEST gateway.
# Releases to production happen separately (tag on main → lab04-release.yml).
#
# File-based deploy via `docker cp` — the runner is a container without the
# host's paths, so it ships files INTO the test gateway's container and then
# asks the gateway to scan. The gateway's projects/ and config/ are
# bind-mounted from ./gateways/test on the host, so you can verify what a
# deploy shipped with `ls gateways/test/projects`. Runs on a self-hosted
# runner with the `lab04` label that has access to the same Docker daemon
# as the test gateway container.
#
# Required setup on GitHub (Settings → Environments → "lab04-gateway-test"):
#   Secret:    IGNITION_API_KEY    The IGNITION_API_KEY_TEST value from your
#                                  .env (scripts/setup.sh generated it,
#                                  unique to your clone).
#   Variable:  IGNITION_URL        Optional. Defaults to
#                                  http://ignition-test:8088 — the in-compose
#                                  service name (the lab's bundled runner runs
#                                  on the same docker network as the gateways).
#                                  Override to http://localhost:8089 if your
#                                  runner is on the host instead.
#   Variable:  IGNITION_CONTAINER  Optional. Defaults to lab04-ignition-test.

name: Lab 04 · Deploy

on:
  push:
    branches: [main]
    paths:
      - "labs/04-ignition-file-based-deploy/projects/**"
      - "labs/04-ignition-file-based-deploy/services/config/**"
      - "labs/04-ignition-file-based-deploy/.deployignore"
      - "labs/04-ignition-file-based-deploy/scripts/scan.sh"
      - "labs/04-ignition-file-based-deploy/scripts/lib.sh"
      - ".github/workflows/lab04-deploy.yml"
  workflow_dispatch:

concurrency:
  group: lab04-deploy-lab04-gateway-test
  cancel-in-progress: false

permissions:
  contents: read

# Every run step works inside the lab folder: the prune, the docker cp and
# the rest all see this lab's files, not the whole monorepo.
defaults:
  run:
    working-directory: labs/04-ignition-file-based-deploy

jobs:
  # No validation job here: lab04-ci.yml already ran on the PR that put this commit
  # on main — that PR run is the gate, so re-running it before every deploy
  # would validate the same commit twice. The trade-off: a direct push to
  # main skips validation, which is why main only moves via PRs.
  deploy:
    name: Deploy to test gateway
    # Fork-only: this job deploys to your own gateways (or your own GHCR), so it
    # skips on the course repo Mustry-Academy/cicd-for-ignition itself.
    if: github.repository != 'Mustry-Academy/cicd-for-ignition'
    runs-on: [self-hosted, lab04]
    environment: lab04-gateway-test
    env:
      IGNITION_URL: ${{ vars.IGNITION_URL || 'http://ignition-test:8088' }}
      IGNITION_CONTAINER: ${{ vars.IGNITION_CONTAINER || 'lab04-ignition-test' }}
      IGNITION_API_KEY: ${{ secrets.IGNITION_API_KEY }}
      GATEWAY_DATA_PATH: /usr/local/bin/ignition/data
      # The gateway's -Dignition.config.mode (docker-compose.yaml) and this
      # job's environment, for the first-deploy check and error messages.
      CONFIG_MODE: test
      ENVIRONMENT: lab04-gateway-test

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Verify deploy prerequisites
        run: |
          set -euo pipefail
          command -v docker >/dev/null || { echo "docker CLI not installed on runner"; exit 1; }
          test -n "$IGNITION_API_KEY" || { echo "IGNITION_API_KEY secret is missing"; exit 1; }
          if ! docker inspect "$IGNITION_CONTAINER" >/dev/null 2>&1; then
            echo "Container '$IGNITION_CONTAINER' not found on this runner's Docker daemon" >&2
            exit 1
          fi
          state="$(docker inspect -f '{{.State.Status}}' "$IGNITION_CONTAINER")"
          if [ "$state" != "running" ]; then
            echo "Container '$IGNITION_CONTAINER' is in state '$state', expected 'running'" >&2
            exit 1
          fi
          echo "Prerequisites OK (container=$IGNITION_CONTAINER state=$state)."

      - name: Prune working tree per .deployignore
        # The way .gitignore works: a leading slash (/tests/) anchors a
        # pattern to the lab root; any other pattern containing a slash is a
        # lab-relative path; bare names (tests/, .DS_Store, *.swp) match
        # anywhere in the tree, projects included.
        run: |
          set -euo pipefail
          [ -f .deployignore ] || { echo "No .deployignore — skipping prune"; exit 0; }
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            pat="${line%/}"
            # Leading / → anchored to the lab root (./tests, not any tests/).
            [[ "$pat" == /* ]] && pat=".$pat"
            if [[ "$pat" == */* ]]; then
              if [ -e "$pat" ]; then
                echo "  pruning (path):  $pat"
                rm -rf -- "$pat"
              fi
            else
              while IFS= read -r -d '' p; do
                echo "  pruning (match): $p"
                rm -rf -- "$p"
              done < <(find . -name "$pat" -print0 2>/dev/null)
            fi
          done < .deployignore

      - name: Ship projects and config into gateway container
        # Wipe-then-copy so a deleted-in-repo resource also disappears from the
        # gateway ("deleted in repo → deleted on gateway"). We wipe projects/ AND
        # config/, but preserve the subtrees the gateway owns and that
        # .deployignore prunes (so they are NOT copied back):
        #   config/local/ and config/resources/local/  — per-instance identity
        #     (UUID, OPC-UA keystores, machine-local system props)
        #   config/resources/core/ignition/user-source/{default,opcua-module}/
        #     and identity-provider/default/ — the gateway-owned INTERNAL
        #     identity; users.json holds THIS gateway's admin password hash.
        #     Wiping or overwriting it locks everyone out.
        #   config/resources/core/ignition/api-token/ — this gateway's scan-API
        #     token, generated per clone by setup.sh and never committed (a
        #     committed token would be a working credential in every fork).
        #     Wiping it would revoke the very key this workflow scans with.
        #   config/resources/.resources/ — the running gateway's content-addressed
        #     blob store (gitignored, so never in the payload). Deleting it under
        #     a live gateway breaks every login (NoSuchFileException on a blob)
        #     until a successful config scan or a restart rebuilds it.
        # Wiping any of those would strip state nothing in the checkout can
        # restore. Everything else under config/ IS repo-owned and is wiped
        # and copied fresh — including security-properties (permission policy)
        # and any identity resources you added yourself (database/AD user
        # sources, SAML/OIDC providers — those hold no password data).
        run: |
          set -euo pipefail
          docker exec "$IGNITION_CONTAINER" sh -c "
            set -eu
            rm -rf '$GATEWAY_DATA_PATH/projects/'*
            find '$GATEWAY_DATA_PATH/config' -mindepth 1 -maxdepth 1 \
              ! -name local ! -name resources -exec rm -rf {} +
            if [ -d '$GATEWAY_DATA_PATH/config/resources' ]; then
              find '$GATEWAY_DATA_PATH/config/resources' -mindepth 1 -maxdepth 1 \
                ! -name local ! -name core ! -name .resources -exec rm -rf {} +
            fi
            if [ -d '$GATEWAY_DATA_PATH/config/resources/core' ]; then
              find '$GATEWAY_DATA_PATH/config/resources/core' -mindepth 1 -maxdepth 1 \
                ! -name ignition -exec rm -rf {} +
            fi
            if [ -d '$GATEWAY_DATA_PATH/config/resources/core/ignition' ]; then
              find '$GATEWAY_DATA_PATH/config/resources/core/ignition' -mindepth 1 -maxdepth 1 \
                ! -name user-source ! -name identity-provider ! -name api-token -exec rm -rf {} +
            fi
            if [ -d '$GATEWAY_DATA_PATH/config/resources/core/ignition/user-source' ]; then
              find '$GATEWAY_DATA_PATH/config/resources/core/ignition/user-source' -mindepth 1 -maxdepth 1 \
                ! -name default ! -name opcua-module -exec rm -rf {} +
            fi
            if [ -d '$GATEWAY_DATA_PATH/config/resources/core/ignition/identity-provider' ]; then
              find '$GATEWAY_DATA_PATH/config/resources/core/ignition/identity-provider' -mindepth 1 -maxdepth 1 \
                ! -name default -exec rm -rf {} +
            fi
          "
          docker cp ./projects/.        "$IGNITION_CONTAINER:$GATEWAY_DATA_PATH/projects/"
          docker cp ./services/config/. "$IGNITION_CONTAINER:$GATEWAY_DATA_PATH/config/"

          # docker cp writes as root, but the gateway runs as uid 2003: left
          # root-owned, it cannot create config/resources/.resources on its
          # next boot and FAULTs. Hand the shipped trees to the gateway,
          # keeping the host-side group (the student's, via the setgid bind
          # mounts) group-writable so the files stay editable on the host too.
          docker exec -u root "$IGNITION_CONTAINER" sh -c "
            set -eu
            gid=\$(stat -c %g '$GATEWAY_DATA_PATH/config')
            chown -R 2003:\"\$gid\" '$GATEWAY_DATA_PATH/projects' '$GATEWAY_DATA_PATH/config'
            chmod -R g+w '$GATEWAY_DATA_PATH/projects' '$GATEWAY_DATA_PATH/config'
            find '$GATEWAY_DATA_PATH/projects' '$GATEWAY_DATA_PATH/config' -type d -exec chmod g+s {} +
          "

      - name: Trigger gateway scan
        # Call the scan API inline rather than scripts/scan.sh: the prune
        # step above removes scripts/ (it is in .deployignore), so that script is
        # not on disk in this job.
        #
        # First deploy to a fresh gateway: it booted before it had its
        # $CONFIG_MODE config mode on disk (the Ship step just copied it in),
        # and Ignition only picks its deployment mode at boot. A scan would
        # load the files but leave the gateway on `core`, so instead restart
        # it once. Every later deploy finds the mode active and scans hot.
        #
        # 401: the gateway rejected the API key, so fail fast and say which
        # secret to check. 403: the key is valid but lacks permission, which
        # happens when first-boot commissioning reset security-properties (the
        # Ship step just copied the repo's copy back, read at boot): restart
        # once and retry.
        run: |
          set -euo pipefail
          key_rejected() {
            echo "::error::The gateway rejected the API key (HTTP 401). Check that the IGNITION_API_KEY secret on environment '$ENVIRONMENT' matches IGNITION_API_KEY_$(printf '%s' "$CONFIG_MODE" | tr '[:lower:]' '[:upper:]') in your .env. If it does, re-run scripts/setup.sh: it rewrites the gateway's token."
            exit 1
          }
          restart_gateway() {
            docker restart "$IGNITION_CONTAINER" >/dev/null
            for _ in $(seq 1 60); do
              if curl -fsS --max-time 3 "$IGNITION_URL/StatusPing" 2>/dev/null | grep -q RUNNING; then
                echo "gateway RUNNING again"
                return 0
              fi
              sleep 5
            done
            echo "gateway did not reach RUNNING after restart" >&2
            exit 1
          }
          run_scans() {
            local what code
            for what in projects config; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                --connect-timeout 5 --max-time 30 \
                -H "X-Ignition-API-Token: $IGNITION_API_KEY" \
                "$IGNITION_URL/data/api/v1/scan/$what")"
              echo "scan $what -> HTTP $code"
              case "$code" in
                401) return 41 ;;
                403) return 43 ;;
              esac
              if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
                echo "scan $what failed (HTTP $code)" >&2
                return 1
              fi
            done
          }

          info="$(curl -sS -w '\n%{http_code}' --connect-timeout 5 --max-time 30 \
            -H "X-Ignition-API-Token: $IGNITION_API_KEY" \
            "$IGNITION_URL/data/api/v1/gateway-info")"
          code="${info##*$'\n'}"
          echo "gateway-info -> HTTP $code"
          [ "$code" = "401" ] && key_rejected
          if [ "$code" = "200" ]; then
            mode="$(printf '%s' "$info" | sed -n 's/.*"deploymentMode":"\([^"]*\)".*/\1/p')"
            if [ "$mode" != "$CONFIG_MODE" ]; then
              echo "First deploy to this gateway: it runs in mode '${mode:-none}', not '$CONFIG_MODE'."
              echo "Ignition picks its deployment mode at boot, so restarting it once to load"
              echo "the mode and everything just shipped. Later deploys scan hot, no restart."
              restart_gateway
            fi
          fi

          rc=0
          run_scans || rc=$?
          if [ "$rc" = "43" ]; then
            echo "Scan forbidden (HTTP 403): the gateway has not loaded the permissions"
            echo "just shipped (security-properties is read at boot). Restarting it once."
            restart_gateway
            rc=0
            run_scans || rc=$?
          fi
          [ "$rc" = "41" ] && key_rejected
          exit "$rc"

      - name: Smoke-check gateway health
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --max-time 3 "$IGNITION_URL/StatusPing" >/dev/null; then
              echo "gateway healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not respond after deploy" >&2
          exit 1
